<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازیابی رمز عبور</title>
	
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <div class="ring">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>

            <div class="login-box">
                <h2>بازیابی رمز عبور</h2>
                <form>
                    <div class="input-group">
                        <input type="email" required>
                        <label>پست الکترونیک (ایمیل)</label>
                    </div>
                    
                    <p style="color: #7c9abf; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.6;">
                        لطفاً ایمیل خود را وارد کنید تا لینک بازنشانی رمز عبور برای شما ارسال شود.
                    </p>

                    <button type="submit" class="login-btn">ارسال لینک بازیابی</button>
                    <p class="signup-text"><a href="index.html" style="font-weight: bold;">بازگشت به صفحه ورود</a></p>
                </form>
            </div>
        </div> <!-- پایان ring -->
    </div> <!-- پایان main-container -->

    <script>
        const bars = document.querySelectorAll('.bar');
        bars.forEach((bar, index) => {
            bar.style.animationDelay = (index * 0.08) + 's';
        });
    </script>
</body>
</html>
