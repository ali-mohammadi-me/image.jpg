<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه نمایش تصویر</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        .profile-img {
            width: 400px; 
            height: 400px;
            border-radius: 50%; 
            object-fit: cover;
            border: 8px solid 
            margin-bottom: 20px;
        }
        h2 {
            color: #333;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="photo22.jpg" alt="عکس پروفایل علی محمدی" class="profile-img">
        <h2>علی محمدی</h2>
    </div>
