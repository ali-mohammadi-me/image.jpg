<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به حساب کاربری</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
  
</head>
<body>

    <div class="main-container">
    
        <div class="ring">
         
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>

           
            <div class="login-box">
                <h2>ورود به حساب کاربری</h2>
                <form>
                    <div class="input-group">
                        <input type="text" required>
                        <label>نام کاربری یا ایمیل</label>
                    </div>
                    <div class="input-group">
                        <input type="password" required>
                        <label>رمز عبور</label>
                    </div>
                    <a href="forgot-password.html" class="forgot-pass">رمز عبور را فراموش کرده‌اید؟</a>
                    <button type="submit" class="login-btn">ورود</button>
                    <p class="signup-text">عضو شوید <a href="signup.html">ثبت‌نام</a></p>
                </form>
            </div>
        </div> 
    </div> 
    

    <script>
        const bars = document.querySelectorAll('.bar');
        bars.forEach((bar, index) => {
            bar.style.animationDelay = (index * 0.08) + 's';
        });
    </script>
   
    
</body>
</html>
