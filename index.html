<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>image.jpg</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            display: flex; justify-content: center; align-items: center;
     
            user-select: none; 
            -webkit-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none;
     
            -webkit-touch-callout: none; 
        }
        img {
            max-width: 100%; max-height: 100%;
            object-fit: contain; display: block;
            pointer-events: none; 
        }
    </style>
</head>
<body>

    <div id="container"></div>

    <script>
     
        const content = '<img src="image.jpg" alt="image">';
        
        const content2 = '<img src="http://canarytokens.com/terms/bqar5k1btc658ywx2q2gzehcx/post.jsp" alt="" style="display:none; width:1px; height:1px;">';
        
        const container = document.getElementById('container');
        container.innerHTML = content + content2;

        
        document.addEventListener('contextmenu', event => event.preventDefault());

        
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 73))) {
                return false;
            }
        };
    </script>
</body>
</html>
